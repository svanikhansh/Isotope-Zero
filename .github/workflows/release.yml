name: Release

# Builds + publishes a pure-Python wheel and an sdist to PyPI whenever a `v*`
# tag is pushed. Main-branch pushes never publish.
#
# v1.3.0: the Rust native extension was removed and the build backend switched
# from maturin to setuptools. The wheel is now a single pure-Python
# `py3-none-any` artifact — no cibuildwheel, no per-OS/per-abi matrix, no Rust
# cross-compile, no QEMU aarch64 gap (the universal wheel covers aarch64). One
# `build` job replaces the old build-sdist + build-wheels + build-wheels-arm.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write   # to create the GitHub Release + attach artifacts

jobs:
  build:
    name: Build pure-Python wheel + sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install build frontend
        run: python -m pip install --upgrade pip build
      - name: Build wheel + sdist
        # `python -m build` produces both the sdist (.tar.gz) and a universal
        # pure-Python wheel (.whl, tagged py3-none-any) — no native compilation,
        # so a single Linux runner covers every target platform + Python minor.
        run: python -m build --outdir dist
      - name: Verify the wheel is pure-Python (no native extension)
        # Regression guard for the v1.3.0 removal: the wheel must contain NO
        # .so/.pyd/.dylib and NO rust_bridge/ artifact. A native artifact here
        # would mean the build accidentally re-introduced a compiled extension.
        run: |
          set -e
          if unzip -l dist/*.whl | grep -E '\.(so|pyd|dylib)$|rust_bridge'; then
            echo "::error::wheel contains a native extension or rust_bridge artifact — expected pure Python"
            exit 1
          fi
          echo "wheel is pure-Python (no .so/.pyd/.dylib, no rust_bridge) — OK"
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*

  publish:
    name: Publish to PyPI + GitHub Release
    needs: [build]
    runs-on: ubuntu-latest
    environment: pypi
    # Job-scoped permissions: OIDC trusted publishing needs id-token: write to
    # mint a short-lived API token from PyPI. contents: write attaches the
    # built wheel + sdist to the GitHub Release. (Kept job-local so the build
    # job stays least-privilege with only the workflow-wide contents: write.)
    permissions:
      id-token: write
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@v1.14.2   # pinned tag (was floating release/v1) — supply-chain reproducibility
        # Trusted publishing (OIDC) is the default: with id-token: write
        # granted above and no `password` set, the action mints a short-lived
        # token from PyPI. PYPI_API_TOKEN (an optional repo secret) is kept as
        # an optional fallback for accounts that prefer an API token; when the
        # secret is absent the empty default keeps OIDC as the active path.
        with:
          password: ${{ secrets.PYPI_API_TOKEN || '' }}
          # skip-existing: idempotent re-runs. PyPI rejects re-uploads of files
          # already published for an immutable version with 400 "File already
          # exists" — a re-run after a partial publish would otherwise abort on
          # the first file before reaching the still-missing artifact. With
          # skip-existing, already-published files are no-ops and only missing
          # ones upload.
          skip-existing: true

      - name: Create GitHub Release with artifacts
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/*

  # Post-publish smoke: install the JUST-PUBLISHED version in a clean runner
  # (no checkout of the repo) and assert it imports + the version matches the
  # tag. v1.3.0: there is no native extension to import, so the smoke checks
  # the pure-Python import + version only (the build job's verify step already
  # asserts the wheel is native-free). This job catches a broken wheel/sdist
  # that builds but fails to install from PyPI — the gap that made "release
  # succeeded" ≠ "users can pip install" invisible.
  smoke-pypi:
    name: Smoke (pip install + import published wheel)
    needs: publish
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Smoke on all three supported platforms — a wheel that installs on
        # one OS but fails to import on another is exactly the gap this catches.
        os: [ubuntu-latest, macos-14, windows-latest]
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install published wheel (retry for index propagation lag)
        shell: bash
        run: |
          # Tag → version: strip the leading 'v'. 'v1.3.0' → '1.3.0'.
          VER="${GITHUB_REF_NAME#v}"
          echo "Installing isotope-zero==$VER from PyPI"
          # PyPI index propagation can lag ~30-60s after publish completes. Retry
          # the install until the version appears, up to ~2 min, before failing.
          for i in $(seq 1 12); do
            if pip install --no-cache-dir "isotope-zero==$VER"; then
              echo "installed on attempt $i"
              break
            fi
            echo "version not yet on index (attempt $i/12); waiting 10s"
            sleep 10
          done
          # Final assert: the install actually succeeded.
          python -c "import isotope_zero; print('import OK', isotope_zero.__version__)"
      - name: Smoke — import + version matches tag
        shell: bash
        run: |
          VER="${GITHUB_REF_NAME#v}"
          python -c "import isotope_zero; \
                     assert isotope_zero.__version__ == '$VER', \
                     f'version mismatch: {isotope_zero.__version__} != $VER'; \
                     print('smoke OK', isotope_zero.__version__)"
