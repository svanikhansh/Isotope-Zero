name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: pytest (Python ${{ matrix.python-version }} / ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14, windows-latest]
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install Rust toolchain (for the _native extension)
        uses: dtolnay/rust-toolchain@stable

      - name: Install package with dev dependencies
        # maturin builds the PyO3 _native extension as part of the editable
        # install. If the build is unavailable in a sandbox, the pure-Python
        # Smart Bridge (core/native.py, HAVE_NATIVE=False) keeps the suite
        # green — only the Rust accelerator is lost.
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run test suite (stress tests auto-skip without IZERO_STRESS)
        # -m "not perf": wall-clock SLA benchmarks (test_hybrid_search
        # ::TestHybridPerf, 5ms p99) are excluded from the shared-runner
        # matrix — a microsecond-scale wall-clock gate is noise on a
        # contended GitHub runner, not signal. They still run every push in
        # the informational stress job below, so a latency regression is
        # measured and reported, just not a hard fail on shared hardware.
        run: pytest src/tests/ -q -m "not perf"

  # The extreme-stress suite needs the real ONNX embedder + 10k cards and is
  # gated behind IZERO_STRESS=1. It is intentionally NOT run on every CI cell
  # (heavy) — one matrix cell only, so a latency/RSS regression still fails CI.
  stress:
    name: stress (10k cards, p99 + RSS budgets)
    runs-on: ubuntu-latest
    continue-on-error: true   # informational; do not block PRs on stress budgets
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: dtolnay/rust-toolchain@stable
      - name: Install package with all optional backends
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,onnx]"
      - name: Run stress + perf budgets (vector p99 ≤ 250ms, sql p99 ≤ 1ms,
          hybrid p99 ≤ 5ms, RSS ≤ 4GB)
        env:
          IZERO_STRESS: "1"
        run: pytest src/tests/test_extreme_stress.py src/tests/test_hybrid_search.py::TestHybridPerf -q
