[package]
name = "isotope_core"
version = "0.2.0"
edition = "2021"

[lib]
name = "isotope_core"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.21", features = ["abi3-py310"] }
rayon = "1.8"
# Zero-copy read of the numpy (n, dim) float32 matrix so the Rust hot path
# never round-trips through Python float objects (that would defeat the
# sub-0.05 ms target). Matches pyo3 0.21.
numpy = "0.21"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
