[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "isotope-zero"
version = "0.4.0a1"
description = "Int8 scalar quantization (SQ8) prototype — 75% embedding RAM reduction, int8 dot-product eval"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Isotope Zero" }]
dependencies = [
    "onnxruntime>=1.17",
    "tokenizers>=0.15",
    "pydantic>=2.6",
    "mcp>=1.0",
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "hypothesis>=6.100",
]

[project.scripts]
izero = "isotope_zero.cli.debug:main"
izero-benchmark = "isotope_zero.eval.benchmark:main"
izero-mcp = "isotope_zero.mcp.server:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["isotope_zero*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]
